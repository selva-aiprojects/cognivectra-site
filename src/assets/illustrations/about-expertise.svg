<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="expertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Expertise Tower -->
  <g transform="translate(200, 80)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="url(#expertGrad)" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Building Blocks -->
    <rect x="-30" y="-20" width="60" height="8" rx="2" fill="#8B5CF6" opacity="0.8"/>
    <rect x="-25" y="-8" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-20" y="4" width="40" height="8" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-15" y="16" width="30" height="8" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Expertise Icons -->
    <circle cx="-20" cy="-15" r="3" fill="#10B981"/>
    <circle cx="0" cy="-15" r="3" fill="#06B6D4"/>
    <circle cx="20" cy="-15" r="3" fill="#F59E0B"/>
    
    <circle cx="-15" cy="-3" r="3" fill="#10B981"/>
    <circle cx="0" cy="-3" r="3" fill="#06B6D4"/>
    <circle cx="15" cy="-3" r="3" fill="#F59E0B"/>
    
    <circle cx="-10" cy="9" r="3" fill="#10B981"/>
    <circle cx="0" cy="9" r="3" fill="#06B6D4"/>
    <circle cx="10" cy="9" r="3" fill="#F59E0B"/>
    
    <!-- Crown at top -->
    <path d="M -10 -30 L 0 -35 L 10 -30 L 5 -25 L 0 -27 L -5 -25 Z" fill="#F59E0B" opacity="0.8"/>
    
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Expertise</text>
  </g>
  
  <!-- Team Collaboration -->
  <g transform="translate(80, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#teamGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Team Members -->
    <circle cx="-15" cy="-15" r="5" fill="#10B981" opacity="0.8"/>
    <circle cx="-15" cy="-15" r="3" fill="#0B0E14"/>
    
    <circle cx="0" cy="-15" r="5" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="-15" r="3" fill="#0B0E14"/>
    
    <circle cx="15" cy="-15" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="15" cy="-15" r="3" fill="#0B0E14"/>
    
    <!-- Collaboration Lines -->
    <path d="M -15 -10 L 0 -10 L 15 -10" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
    <path d="M -15 -5 L 0 0 L 15 -5" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <path d="M -15 0 L 0 5 L 15 0" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
    
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="4" fill="#8B5CF6">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Team</text>
  </g>
  
  <!-- Knowledge Base -->
  <g transform="translate(200, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#teamGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Books/Knowledge -->
    <rect x="-20" y="-25" width="40" height="50" rx="4" fill="#0B0E14"/>
    
    <!-- Book Spines -->
    <rect x="-18" y="-23" width="8" height="46" rx="1" fill="#10B981" opacity="0.8"/>
    <rect x="-8" y="-23" width="8" height="46" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="2" y="-23" width="8" height="46" rx="1" fill="#F59E0B" opacity="0.8"/>
    <rect x="12" y="-23" width="8" height="46" rx="1" fill="#EF4444" opacity="0.8"/>
    
    <!-- Book Details -->
    <rect x="-16" y="-20" width="4" height="40" rx="1" fill="#0B0E14"/>
    <rect x="-6" y="-20" width="4" height="40" rx="1" fill="#0B0E14"/>
    <rect x="4" y="-20" width="4" height="40" rx="1" fill="#0B0E14"/>
    <rect x="14" y="-20" width="4" height="40" rx="1" fill="#0B0E14"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Knowledge</text>
  </g>
  
  <!-- Innovation/Lightbulb -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#teamGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Lightbulb -->
    <circle cx="0" cy="-10" r="15" fill="#F59E0B" opacity="0.8"/>
    <rect x="-8" y="5" width="16" height="8" rx="4" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Filament -->
    <path d="M -5 -10 Q 0 -15 5 -10" stroke="#0B0E14" stroke-width="2" fill="none"/>
    <circle cx="-3" cy="-10" r="2" fill="#0B0E14"/>
    <circle cx="3" cy="-10" r="2" fill="#0B0E14"/>
    
    <!-- Light Rays -->
    <path d="M 0 -25 L 0 -30" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M -15 -20 L -20 -25" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <path d="M 15 -20 L 20 -25" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M -20 -10 L -25 -10" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.75s" repeatCount="indefinite"/>
    </path>
    <path d="M 20 -10 L 25 -10" stroke="#F59E0B" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="1s" repeatCount="indefinite"/>
    </path>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Innovation</text>
  </g>
  
  <!-- Skills/Tools -->
  <g transform="translate(50, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#teamGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Tool Icons -->
    <circle cx="-15" cy="-15" r="4" fill="#10B981"/>
    <rect x="-17" y="-13" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="0" cy="-15" r="4" fill="#06B6D4"/>
    <rect x="-2" y="-13" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="15" cy="-15" r="4" fill="#F59E0B"/>
    <rect x="13" y="-13" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="-15" cy="0" r="4" fill="#EF4444"/>
    <rect x="-17" y="2" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="0" cy="0" r="4" fill="#10B981"/>
    <rect x="-2" y="2" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="15" cy="0" r="4" fill="#06B6D4"/>
    <rect x="13" y="2" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="-15" cy="15" r="4" fill="#F59E0B"/>
    <rect x="-17" y="17" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="0" cy="15" r="4" fill="#EF4444"/>
    <rect x="-2" y="17" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <circle cx="15" cy="15" r="4" fill="#10B981"/>
    <rect x="13" y="17" width="4" height="4" rx="1" fill="#0B0E14"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Skills</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 80 170 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 150 200 L 170 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 230 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 50 230 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 110 L 320 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Growth Arrow -->
  <g transform="translate(200, 150)">
    <path d="M 0 -20 L 0 20" stroke="#10B981" stroke-width="4" opacity="0.8"/>
    <path d="M -5 15 L 0 20 L 5 15" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <circle cx="0" cy="0" r="6" fill="#10B981" opacity="0.8">
      <animate attributeName="cy" values="-20;20;-20" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Success Indicators -->
  <g transform="translate(350, 80)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(50, 80)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
