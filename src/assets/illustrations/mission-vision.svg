<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="missionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Mountain/Peak representing Vision -->
  <g transform="translate(200, 80)">
    <path d="M -80 50 L -40 -30 L 0 -50 L 40 -30 L 80 50 Z" fill="url(#visionGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Flag at Peak -->
    <rect x="-2" y="-50" width="4" height="40" fill="#10B981"/>
    <path d="M 2 -50 L 20 -45 L 20 -40 L 2 -35 Z" fill="#EF4444"/>
    
    <!-- Stars around peak -->
    <circle cx="-60" cy="-40" r="2" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-30" cy="-60" r="2" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="-60" r="2" fill="#F59E0B">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="-40" r="2" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    
    <text x="0" y="70" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Vision</text>
  </g>
  
  <!-- Path representing Mission -->
  <g transform="translate(200, 200)">
    <path d="M -60 0 Q -30 -20 0 0 Q 30 20 60 0" stroke="url(#missionGrad)" stroke-width="4" fill="none"/>
    
    <!-- Steps on the path -->
    <circle cx="-60" cy="0" r="4" fill="#10B981"/>
    <circle cx="-30" cy="-10" r="4" fill="#06B6D4"/>
    <circle cx="0" cy="0" r="4" fill="#F59E0B"/>
    <circle cx="30" cy="10" r="4" fill="#EF4444"/>
    <circle cx="60" cy="0" r="4" fill="#8B5CF6"/>
    
    <!-- Direction arrow -->
    <path d="M 60 0 L 70 0 L 65 -5 M 70 0 L 65 5" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="0" y="30" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Mission</text>
  </g>
  
  <!-- Compass/Guiding Principles -->
  <g transform="translate(80, 200)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#missionGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#missionGrad)" stroke-width="2"/>
    
    <!-- Compass Points -->
    <path d="M 0 -25 L 5 -20 L 0 -15 L -5 -20 Z" fill="#10B981"/>
    <path d="M 25 0 L 20 -5 L 15 0 L 20 5 Z" fill="#06B6D4"/>
    <path d="M 0 25 L -5 20 L 0 15 L 5 20 Z" fill="#F59E0B"/>
    <path d="M -25 0 L -20 -5 L -15 0 L -20 5 Z" fill="#EF4444"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="5" fill="#8B5CF6"/>
    
    <text x="0" y="45" text-anchor="middle" fill="#94A3B8" font-size="10">Guiding Principles</text>
  </g>
  
  <!-- Values Pillars -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#missionGrad)" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Value Pillars -->
    <rect x="-20" y="-20" width="8" height="40" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-8" y="-15" width="8" height="35" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="4" y="-25" width="8" height="40" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="16" y="-10" width="8" height="30" rx="2" fill="#EF4444" opacity="0.8"/>
    
    <!-- Growth indicators -->
    <path d="M -20 -20 L -20 -25" stroke="#10B981" stroke-width="2"/>
    <path d="M -8 -15 L -8 -20" stroke="#06B6D4" stroke-width="2"/>
    <path d="M 4 -25 L 4 -30" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 16 -10 L 16 -15" stroke="#EF4444" stroke-width="2"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Core Values</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 120 200 L 140 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 260 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 130 L 200 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Animated Elements -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="8" fill="#10B981" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Success Indicators -->
  <g transform="translate(50, 80)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(350, 80)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
