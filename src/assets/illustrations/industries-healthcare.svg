<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Hospital Building -->
  <g transform="translate(200, 80)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="url(#healthGrad)" stroke="#EF4444" stroke-width="2"/>
    
    <!-- Red Cross -->
    <rect x="-8" y="-20" width="16" height="40" fill="white"/>
    <rect x="-20" y="-8" width="40" height="16" fill="white"/>
    
    <!-- Windows -->
    <rect x="-35" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <rect x="-35" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Hospital</text>
  </g>
  
  <!-- Medical Devices -->
  <g transform="translate(80, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#medGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Heart Monitor -->
    <rect x="-20" y="-20" width="40" height="25" rx="4" fill="#0B0E14"/>
    <path d="M -15 -5 Q -10 -15 -5 -5 Q 0 -15 5 -5 Q 10 -15 15 -5" 
          stroke="#EF4444" stroke-width="2" fill="none">
      <animate attributeName="d" 
               values="M -15 -5 Q -10 -15 -5 -5 Q 0 -15 5 -5 Q 10 -15 15 -5;
                       M -15 -5 Q -10 -10 -5 -5 Q 0 -10 5 -5 Q 10 -10 15 -5;
                       M -15 -5 Q -10 -15 -5 -5 Q 0 -15 5 -5 Q 10 -15 15 -5" 
               dur="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- Device Controls -->
    <circle cx="-10" cy="10" r="3" fill="#F59E0B"/>
    <circle cx="0" cy="10" r="3" fill="#10B981"/>
    <circle cx="10" cy="10" r="3" fill="#06B6D4"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Devices</text>
  </g>
  
  <!-- DNA Helix -->
  <g transform="translate(200, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#medGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- DNA Strands -->
    <path d="M -15 -20 Q 0 -10 15 0 Q 0 10 -15 20" stroke="#EF4444" stroke-width="3" fill="none"/>
    <path d="M -15 -20 Q 0 -10 15 0 Q 0 10 -15 20" stroke="#10B981" stroke-width="3" fill="none" transform="rotate(180)"/>
    
    <!-- Base Pairs -->
    <circle cx="-10" cy="-15" r="2" fill="#F59E0B"/>
    <circle cx="10" cy="-15" r="2" fill="#F59E0B"/>
    <circle cx="-5" cy="-5" r="2" fill="#06B6D4"/>
    <circle cx="5" cy="-5" r="2" fill="#06B6D4"/>
    <circle cx="0" cy="5" r="2" fill="#F59E0B"/>
    <circle cx="0" cy="15" r="2" fill="#06B6D4"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Genomics</text>
  </g>
  
  <!-- Patient Records -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#medGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- File Icon -->
    <rect x="-15" y="-20" width="30" height="40" rx="4" fill="#0B0E14"/>
    <rect x="-10" y="-15" width="20" height="3" rx="1" fill="#10B981"/>
    <rect x="-10" y="-8" width="20" height="3" rx="1" fill="#06B6D4"/>
    <rect x="-10" y="-1" width="20" height="3" rx="1" fill="#F59E0B"/>
    <rect x="-10" y="6" width="20" height="3" rx="1" fill="#EF4444"/>
    <rect x="-10" y="13" width="20" height="3" rx="1" fill="#10B981"/>
    
    <!-- Lock Icon -->
    <circle cx="10" cy="-10" r="3" fill="#EF4444"/>
    <rect x="8" y="-8" width="4" height="3" rx="1" fill="#EF4444"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Records</text>
  </g>
  
  <!-- Telemedicine -->
  <g transform="translate(50, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#medGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Video Call -->
    <rect x="-20" y="-20" width="40" height="30" rx="4" fill="#0B0E14"/>
    
    <!-- Camera -->
    <circle cx="0" cy="-5" r="8" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="-5" r="5" fill="#0B0E14"/>
    <circle cx="0" cy="-5" r="2" fill="#10B981"/>
    
    <!-- Signal Waves -->
    <path d="M 5 -5 Q 10 -10 15 -5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 5 -5 Q 10 -5 15 -5" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 5 -5 Q 10 0 15 -5" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8"/>
    
    <!-- User Icons -->
    <circle cx="-10" cy="10" r="3" fill="#10B981"/>
    <circle cx="0" cy="10" r="3" fill="#06B6D4"/>
    <circle cx="10" cy="10" r="3" fill="#F59E0B"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Telehealth</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 80 170 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 150 200 L 170 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 230 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 80 230 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 110 L 320 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Medical Cross Animation -->
  <g transform="translate(200, 150)">
    <rect x="-4" y="-8" width="8" height="16" fill="#EF4444" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-8" y="-4" width="16" height="8" fill="#EF4444" opacity="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Pulse Animation -->
  <g transform="translate(350, 80)">
    <circle cx="0" cy="0" r="8" fill="#EF4444" opacity="0.8">
      <animate attributeName="r" values="8;12;8" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
