<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="automationGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Central Gear -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="40" fill="url(#gearGrad)" opacity="0.8"/>
    <circle cx="0" cy="0" r="20" fill="#0B0E14"/>
    <!-- Gear Teeth -->
    <rect x="-5" y="-45" width="10" height="15" fill="url(#gearGrad)" opacity="0.8"/>
    <rect x="-5" y="30" width="10" height="15" fill="url(#gearGrad)" opacity="0.8"/>
    <rect x="-45" y="-5" width="15" height="10" fill="url(#gearGrad)" opacity="0.8"/>
    <rect x="30" y="-5" width="15" height="10" fill="url(#gearGrad)" opacity="0.8"/>
    <!-- Diagonal teeth -->
    <rect x="-25" y="-35" width="10" height="15" fill="url(#gearGrad)" opacity="0.8" transform="rotate(45)"/>
    <rect x="15" y="-35" width="10" height="15" fill="url(#gearGrad)" opacity="0.8" transform="rotate(45)"/>
    <rect x="-25" y="20" width="10" height="15" fill="url(#gearGrad)" opacity="0.8" transform="rotate(45)"/>
    <rect x="15" y="20" width="10" height="15" fill="url(#gearGrad)" opacity="0.8" transform="rotate(45)"/>
  </g>
  
  <!-- Workflow Nodes -->
  <!-- Node 1: Data Input -->
  <g transform="translate(80, 80)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="url(#automationGrad)" stroke="#6366F1" stroke-width="2"/>
    <rect x="-20" y="-10" width="40" height="4" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-20" y="-2" width="40" height="4" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-20" y="6" width="40" height="4" rx="2" fill="#06B6D4" opacity="0.8"/>
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="12">Input</text>
  </g>
  
  <!-- Node 2: Processing -->
  <g transform="translate(320, 80)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="url(#automationGrad)" stroke="#6366F1" stroke-width="2"/>
    <circle cx="-10" cy="0" r="5" fill="#10B981" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="10" cy="0" r="5" fill="#EF4444" opacity="0.8"/>
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="12">Process</text>
  </g>
  
  <!-- Node 3: Automation -->
  <g transform="translate(80, 220)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="url(#automationGrad)" stroke="#6366F1" stroke-width="2"/>
    <path d="M -15 -5 L -5 5 L 15 -15" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="-15" cy="-5" r="3" fill="#10B981"/>
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="12">Automate</text>
  </g>
  
  <!-- Node 4: Output -->
  <g transform="translate(320, 220)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="url(#automationGrad)" stroke="#6366F1" stroke-width="2"/>
    <path d="M -10 -10 L 10 -10 L 10 10 L -10 10 Z" fill="#10B981" opacity="0.8"/>
    <path d="M -5 -5 L 5 -5 L 5 5 L -5 5 Z" fill="#06B6D4" opacity="0.8"/>
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="12">Output</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 110 80 Q 200 50 290 80" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  <path d="M 320 110 Q 350 150 320 190" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  <path d="M 290 220 Q 200 250 110 220" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  <path d="M 80 190 Q 50 150 80 110" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.6" stroke-dasharray="5,5"/>
  
  <!-- AI/Robot Icon -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="-8" r="6" fill="#8B5CF6" opacity="0.8"/>
    <rect x="-8" y="-2" width="16" height="12" rx="4" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="-3" cy="2" r="1.5" fill="#06B6D4"/>
    <circle cx="3" cy="2" r="1.5" fill="#06B6D4"/>
    <path d="M -6 -8 Q 0 -12 6 -8" stroke="#8B5CF6" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Data Flow Arrows -->
  <g transform="translate(130, 60)">
    <path d="M 0 0 L 20 0 L 15 -5 M 20 0 L 15 5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <g transform="translate(250, 60)">
    <path d="M 0 0 L 20 0 L 15 -5 M 20 0 L 15 5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <g transform="translate(250, 230)">
    <path d="M 0 0 L 20 0 L 15 -5 M 20 0 L 15 5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <g transform="translate(130, 230)">
    <path d="M 0 0 L 20 0 L 15 -5 M 20 0 L 15 5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
</svg>
