<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fintechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Bank Building -->
  <g transform="translate(200, 80)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="url(#bankGrad)" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Columns -->
    <rect x="-40" y="-25" width="15" height="50" rx="2" fill="#EF4444" opacity="0.8"/>
    <rect x="-20" y="-25" width="15" height="50" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="0" y="-25" width="15" height="50" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="20" y="-25" width="15" height="50" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="40" y="-25" width="15" height="50" rx="2" fill="#10B981" opacity="0.8"/>
    
    <!-- Windows -->
    <rect x="-35" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <rect x="-35" y="-5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="-5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="-5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="-5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <rect x="-35" y="10" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="10" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="10" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="10" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="5" y="15" width="10" height="15" rx="2" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="10" cy="22" r="1" fill="#10B981"/>
    
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Bank</text>
  </g>
  
  <!-- Shield Security -->
  <g transform="translate(80, 200)">
    <path d="M 0 -20 L -15 -10 L -15 10 L 0 20 L 15 10 L 15 -10 Z" fill="url(#fintechGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Lock -->
    <rect x="-4" y="-5" width="8" height="10" rx="2" fill="#0B0E14"/>
    <circle cx="0" cy="0" r="3" fill="#10B981"/>
    <path d="M -2 0 L 0 -2 L 2 0 L 0 2 Z" fill="#10B981"/>
    
    <!-- Checkmark -->
    <path d="M -5 5 L -2 8 L 3 3" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Security</text>
  </g>
  
  <!-- Credit Card -->
  <g transform="translate(200, 200)">
    <rect x="-30" y="-20" width="60" height="40" rx="8" fill="url(#fintechGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Card Chip -->
    <rect x="-25" y="-15" width="50" height="25" rx="4" fill="#0B0E14"/>
    
    <!-- Card Number -->
    <text x="0" y="-5" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold">4532</text>
    <text x="0" y="5" text-anchor="middle" fill="#06B6D4" font-size="8">VALID THRU</text>
    
    <!-- Card Details -->
    <text x="0" y="15" text-anchor="middle" fill="#94A3B8" font-size="8">•••• •••• ••••</text>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Payments</text>
  </g>
  
  <!-- Chart/Analytics -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#fintechGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Chart Bars -->
    <rect x="-20" y="10" width="8" height="20" fill="#10B981" opacity="0.8"/>
    <rect x="-8" y="0" width="8" height="30" fill="#06B6D4" opacity="0.8"/>
    <rect x="4" y="-10" width="8" height="40" fill="#F59E0B" opacity="0.8"/>
    <rect x="16" y="-20" width="8" height="50" fill="#EF4444" opacity="0.8"/>
    
    <!-- Trend Line -->
    <path d="M -20 15 Q 0 5 20 -5" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Analytics</text>
  </g>
  
  <!-- Blockchain Nodes -->
  <g transform="translate(50, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#fintechGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- Blockchain -->
    <circle cx="-15" cy="-15" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="-15" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="15" cy="-15" r="6" fill="#F59E0B" opacity="0.8"/>
    
    <circle cx="-15" cy="0" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="15" cy="0" r="6" fill="#F59E0B" opacity="0.8"/>
    
    <circle cx="-15" cy="15" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="15" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="15" cy="15" r="6" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Connections -->
    <path d="M -15 -15 L 0 -15 L 15 -15" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
    <path d="M -15 0 L 0 0 L 15 0" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
    <path d="M -15 15 L 0 15 L 15 15" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Blockchain</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 80 170 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 150 200 L 170 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 230 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 80 230 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 110 L 320 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Money/Coins -->
  <g transform="translate(200, 150)">
    <circle cx="-20" cy="0" r="8" fill="#F59E0B" opacity="0.8">
      <animate attributeName="cy" values="0;-3;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#10B981" opacity="0.8">
      <animate attributeName="cy" values="0;3;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="0" r="8" fill="#06B6D4" opacity="0.8">
      <animate attributeName="cy" values="0;3;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <text x="0" y="25" text-anchor="middle" fill="#94A3B8" font-size="10">Finance</text>
  </g>
  
  <!-- Compliance Badge -->
  <g transform="translate(350, 80)">
    <rect x="-25" y="-15" width="50" height="30" rx="15" fill="url(#fintechGrad)" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="8" font-weight="bold">COMPLIANT</text>
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="6">SECURE</text>
    <text x="0" y="25" text-anchor="middle" fill="white" font-size="6">AUDIT READY</text>
  </g>
</svg>
