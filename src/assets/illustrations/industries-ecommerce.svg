<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ecomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="shopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Shopping Cart -->
  <g transform="translate(200, 80)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="url(#ecomGrad)" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Cart Body -->
    <rect x="-30" y="-20" width="60" height="35" rx="4" fill="#0B0E14"/>
    
    <!-- Cart Handle -->
    <path d="M -25 -15 Q -30 -10 -25 -5" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 25 -15 Q 30 -10 25 -5" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Cart Items -->
    <rect x="-20" y="-10" width="15" height="10" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-2" y="-10" width="15" height="10" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="16" y="-10" width="15" height="10" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <!-- Cart Wheels -->
    <circle cx="-15" cy="15" r="4" fill="#8B5CF6"/>
    <circle cx="15" cy="15" r="4" fill="#8B5CF6"/>
    
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="12" font-weight="bold">E-Commerce</text>
  </g>
  
  <!-- Product Catalog -->
  <g transform="translate(80, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#shopGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Product Grid -->
    <rect x="-20" y="-20" width="15" height="15" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-2" y="-20" width="15" height="15" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="16" y="-20" width="15" height="15" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <rect x="-20" y="-2" width="15" height="15" rx="2" fill="#EF4444" opacity="0.8"/>
    <rect x="-2" y="-2" width="15" height="15" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="16" y="-2" width="15" height="15" rx="2" fill="#06B6D4" opacity="0.8"/>
    
    <rect x="-20" y="16" width="15" height="15" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="-2" y="16" width="15" height="15" rx="2" fill="#EF4444" opacity="0.8"/>
    <rect x="16" y="16" width="15" height="15" rx="2" fill="#10B981" opacity="0.8"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Catalog</text>
  </g>
  
  <!-- Payment Gateway -->
  <g transform="translate(200, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#shopGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Credit Card -->
    <rect x="-20" y="-15" width="40" height="25" rx="4" fill="#0B0E14"/>
    
    <!-- Card Chip -->
    <rect x="-15" y="-10" width="10" height="8" rx="2" fill="#F59E0B"/>
    
    <!-- Card Number -->
    <text x="0" y="-2" text-anchor="middle" fill="#10B981" font-size="8">••••</text>
    
    <!-- Payment Icons -->
    <circle cx="-10" cy="8" r="3" fill="#10B981"/>
    <circle cx="0" cy="8" r="3" fill="#06B6D4"/>
    <circle cx="10" cy="8" r="3" fill="#F59E0B"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Payment</text>
  </g>
  
  <!-- Shipping/Logistics -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#shopGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Package -->
    <rect x="-15" y="-15" width="30" height="25" rx="4" fill="#8B5CF6" opacity="0.8"/>
    <rect x="-15" y="-15" width="30" height="8" rx="2" fill="#6366F1" opacity="0.8"/>
    
    <!-- Delivery Truck -->
    <rect x="-20" y="10" width="25" height="15" rx="3" fill="#10B981" opacity="0.8"/>
    <rect x="-15" y="5" width="15" height="10" rx="2" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="-10" cy="25" r="3" fill="#0B0E14"/>
    <circle cx="5" cy="25" r="3" fill="#0B0E14"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Shipping</text>
  </g>
  
  <!-- Customer Analytics -->
  <g transform="translate(50, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#shopGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- User Icons -->
    <circle cx="-15" cy="-15" r="4" fill="#10B981"/>
    <circle cx="0" cy="-15" r="4" fill="#06B6D4"/>
    <circle cx="15" cy="-15" r="4" fill="#F59E0B"/>
    
    <circle cx="-15" cy="0" r="4" fill="#10B981"/>
    <circle cx="0" cy="0" r="4" fill="#06B6D4"/>
    <circle cx="15" cy="0" r="4" fill="#F59E0B"/>
    
    <circle cx="-15" cy="15" r="4" fill="#10B981"/>
    <circle cx="0" cy="15" r="4" fill="#06B6D4"/>
    <circle cx="15" cy="15" r="4" fill="#F59E0B"/>
    
    <!-- Connection Lines -->
    <path d="M -15 -15 L 0 0 L 15 15" stroke="#06B6D4" stroke-width="1" opacity="0.6"/>
    <path d="M 15 -15 L 0 0 L -15 15" stroke="#06B6D4" stroke-width="1" opacity="0.6"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Customers</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 80 170 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 150 200 L 170 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 230 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 80 230 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 110 L 320 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Shopping Bag Animation -->
  <g transform="translate(200, 150)">
    <rect x="-8" y="-10" width="16" height="20" rx="4" fill="#F59E0B" opacity="0.8">
      <animate attributeName="ry" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <path d="M -5 -10 Q 0 -15 5 -10" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Price Tag -->
  <g transform="translate(350, 80)">
    <path d="M 0 -15 L 10 -5 L 10 5 L 0 15 L -10 5 L -10 -5 Z" fill="#EF4444" opacity="0.8"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="12" font-weight="bold">$</text>
  </g>
</svg>
