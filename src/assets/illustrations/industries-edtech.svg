<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edtechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="learnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- School Building -->
  <g transform="translate(200, 80)">
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="url(#edtechGrad)" stroke="#10B981" stroke-width="2"/>
    
    <!-- School Roof -->
    <path d="M -60 -30 L 0 -50 L 60 -30" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Windows -->
    <rect x="-35" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="-20" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <rect x="-35" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="5" width="10" height="8" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Door -->
    <rect x="-5" y="15" width="10" height="15" rx="2" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="0" cy="22" r="1" fill="#10B981"/>
    
    <text x="0" y="45" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Education</text>
  </g>
  
  <!-- Online Learning Platform -->
  <g transform="translate(80, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#learnGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Laptop Screen -->
    <rect x="-20" y="-20" width="40" height="25" rx="2" fill="#0B0E14"/>
    <rect x="-18" y="-18" width="36" height="21" rx="1" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Course Content -->
    <rect x="-15" y="-15" width="30" height="3" rx="1" fill="#10B981"/>
    <rect x="-15" y="-10" width="25" height="3" rx="1" fill="#F59E0B"/>
    <rect x="-15" y="-5" width="28" height="3" rx="1" fill="#EF4444"/>
    <rect x="-15" y="0" width="20" height="3" rx="1" fill="#10B981"/>
    
    <!-- Play Button -->
    <circle cx="0" cy="8" r="4" fill="#10B981"/>
    <path d="M -2 6 L 2 8 L -2 10 Z" fill="#0B0E14"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">E-Learning</text>
  </g>
  
  <!-- Students/Teachers -->
  <g transform="translate(200, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#learnGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Teacher -->
    <circle cx="-10" cy="-15" r="5" fill="#10B981"/>
    <rect x="-15" y="-10" width="10" height="15" rx="2" fill="#10B981"/>
    
    <!-- Students -->
    <circle cx="10" cy="-15" r="4" fill="#06B6D4"/>
    <rect x="7" y="-11" width="6" height="12" rx="1" fill="#06B6D4"/>
    
    <circle cx="-10" cy="5" r="4" fill="#F59E0B"/>
    <rect x="-13" y="9" width="6" height="12" rx="1" fill="#F59E0B"/>
    
    <circle cx="10" cy="5" r="4" fill="#EF4444"/>
    <rect x="7" y="9" width="6" height="12" rx="1" fill="#EF4444"/>
    
    <!-- Whiteboard -->
    <rect x="-25" y="-25" width="50" height="20" rx="2" fill="#0B0E14"/>
    <text x="0" y="-15" text-anchor="middle" fill="#10B981" font-size="8">ABC</text>
    <text x="0" y="-8" text-anchor="middle" fill="#06B6D4" font-size="8">123</text>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Classroom</text>
  </g>
  
  <!-- Assessment/Testing -->
  <g transform="translate(320, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#learnGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Test Paper -->
    <rect x="-20" y="-20" width="40" height="35" rx="2" fill="#0B0E14"/>
    
    <!-- Questions -->
    <text x="0" y="-15" text-anchor="middle" fill="#10B981" font-size="8">Q1.</text>
    <rect x="-15" y="-10" width="30" height="2" rx="1" fill="#06B6D4"/>
    
    <text x="0" y="-2" text-anchor="middle" fill="#10B981" font-size="8">Q2.</text>
    <rect x="-15" y="3" width="30" height="2" rx="1" fill="#F59E0B"/>
    
    <text x="0" y="11" text-anchor="middle" fill="#10B981" font-size="8">Q3.</text>
    <rect x="-15" y="16" width="30" height="2" rx="1" fill="#EF4444"/>
    
    <!-- Checkboxes -->
    <rect x="-25" y="-10" width="4" height="4" rx="1" fill="#10B981"/>
    <rect x="-25" y="3" width="4" height="4" rx="1" fill="#10B981"/>
    <rect x="-25" y="16" width="4" height="4" rx="1" fill="#10B981"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Assessment</text>
  </g>
  
  <!-- Digital Library -->
  <g transform="translate(50, 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="url(#learnGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Bookshelf -->
    <rect x="-25" y="-25" width="50" height="50" rx="2" fill="#8B5CF6" opacity="0.8"/>
    
    <!-- Books -->
    <rect x="-20" y="-20" width="8" height="40" rx="1" fill="#10B981"/>
    <rect x="-10" y="-20" width="8" height="40" rx="1" fill="#06B6D4"/>
    <rect x="0" y="-20" width="8" height="40" rx="1" fill="#F59E0B"/>
    <rect x="10" y="-20" width="8" height="40" rx="1" fill="#EF4444"/>
    
    <!-- Book Details -->
    <rect x="-18" y="-15" width="4" height="30" rx="1" fill="#0B0E14"/>
    <rect x="-8" y="-15" width="4" height="30" rx="1" fill="#0B0E14"/>
    <rect x="2" y="-15" width="4" height="30" rx="1" fill="#0B0E14"/>
    <rect x="12" y="-15" width="4" height="30" rx="1" fill="#0B0E14"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Library</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 80 170 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 150 200 L 170 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 230 200 L 290 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 80 230 L 170 110" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 110 L 320 170" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Graduation Cap Animation -->
  <g transform="translate(200, 150)">
    <ellipse cx="0" cy="0" rx="12" ry="8" fill="#10B981" opacity="0.8">
      <animate attributeName="rx" values="12;15;12" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-2" y="-8" width="4" height="8" fill="#10B981" opacity="0.8"/>
    <circle cx="0" cy="-10" r="2" fill="#F59E0B">
      <animate attributeName="cy" values="-10;-12;-10" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Knowledge Icons -->
  <g transform="translate(350, 80)">
    <circle cx="0" cy="0" r="8" fill="#10B981" opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" fill="white" font-size="12" font-weight="bold">+</text>
  </g>
</svg>
