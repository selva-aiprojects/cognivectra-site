<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="autoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="autoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="autoGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38F9D7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="autoGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA709A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE140;stop-opacity:1" />
    </linearGradient>
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow Effects -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Premium Background -->
  <rect width="800" height="400" fill="url(#autoGrad1)" opacity="0.1"/>
  <rect width="800" height="400" fill="#0F172A"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.3"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Central Automation Hub -->
  <g transform="translate(400, 200)">
    <!-- Central Gear System -->
    <circle cx="0" cy="0" r="80" fill="url(#autoGrad2)" opacity="0.2" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="60" fill="url(#autoGrad2)" opacity="0.3"/>
    
    <!-- Main Gear -->
    <g transform="rotate(0)">
      <circle cx="0" cy="0" r="50" fill="#1E293B" filter="url(#shadow)"/>
      <circle cx="0" cy="0" r="40" fill="url(#autoGrad3)"/>
      <!-- Gear Teeth -->
      <rect x="-5" y="-55" width="10" height="15" fill="url(#autoGrad3)"/>
      <rect x="-5" y="40" width="10" height="15" fill="url(#autoGrad3)"/>
      <rect x="-55" y="-5" width="15" height="10" fill="url(#autoGrad3)"/>
      <rect x="40" y="-5" width="15" height="10" fill="url(#autoGrad3)"/>
      <!-- Diagonal teeth -->
      <rect x="-25" y="-40" width="10" height="15" fill="url(#autoGrad3)" transform="rotate(45)"/>
      <rect x="15" y="-40" width="10" height="15" fill="url(#autoGrad3)" transform="rotate(45)"/>
      <rect x="-25" y="25" width="10" height="15" fill="url(#autoGrad3)" transform="rotate(45)"/>
      <rect x="15" y="25" width="10" height="15" fill="url(#autoGrad3)" transform="rotate(45)"/>
      
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>
    
    <!-- AI Brain Core -->
    <circle cx="0" cy="0" r="25" fill="url(#autoGrad4)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="20" fill="#0F172A"/>
    
    <!-- Neural Network -->
    <path d="M -10 -10 L 0 0 L 10 -10" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -10 0 L 0 0 L 10 0" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -10 10 L 0 0 L 10 10" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -15 -15 L 0 0 L 15 -15" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M -15 15 L 0 0 L 15 15" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
    
    <!-- Neural Nodes -->
    <circle cx="-10" cy="-10" r="3" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-10" cy="0" r="3" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-10" cy="10" r="3" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="10" cy="-10" r="3" fill="#10B981" filter="url(#glow)"/>
    <circle cx="10" cy="0" r="3" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="10" cy="10" r="3" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-15" cy="-15" r="3" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="15" cy="-15" r="3" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="-15" cy="15" r="3" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="15" cy="15" r="3" fill="#F59E0B" filter="url(#glow)"/>
    
    <!-- Center Node -->
    <circle cx="0" cy="0" r="5" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Workflow Nodes -->
  <g transform="translate(150, 100)">
    <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="url(#autoGrad1)" opacity="0.2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="bold">INPUT</text>
    <rect x="-40" y="0" width="80" height="4" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-40" y="8" width="80" height="4" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-40" y="16" width="80" height="4" rx="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="0" cy="-20" r="4" fill="#10B981" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(650, 100)">
    <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="url(#autoGrad2)" opacity="0.2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="bold">PROCESS</text>
    <circle cx="-20" cy="0" r="6" fill="#10B981" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#06B6D4" opacity="0.8"/>
    <circle cx="20" cy="0" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="0" cy="-20" r="4" fill="#06B6D4" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(150, 300)">
    <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="url(#autoGrad3)" opacity="0.2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="bold">AUTOMATE</text>
    <path d="M -15 5 L 0 15 L 15 5" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="4" fill="#10B981" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(650, 300)">
    <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="url(#autoGrad4)" opacity="0.2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="bold">OUTPUT</text>
    <rect x="-30" y="0" width="60" height="20" rx="4" fill="#10B981" opacity="0.8"/>
    <rect x="-25" y="5" width="50" height="10" rx="2" fill="#0F172A"/>
    <circle cx="0" cy="-20" r="4" fill="#F59E0B" filter="url(#glow)"/>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 210 100 Q 400 150 590 100" stroke="url(#autoGrad2)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="10,5" filter="url(#glow)"/>
  <path d="M 590 100 Q 400 200 210 300" stroke="url(#autoGrad3)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="10,5" filter="url(#glow)"/>
  <path d="M 210 300 Q 400 250 590 300" stroke="url(#autoGrad4)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="10,5" filter="url(#glow)"/>
  <path d="M 150 140 L 150 260" stroke="url(#autoGrad1)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="10,5" filter="url(#glow)"/>
  <path d="M 650 140 L 650 260" stroke="url(#autoGrad1)" stroke-width="3" fill="none" opacity="0.6" stroke-dasharray="10,5" filter="url(#glow)"/>
  
  <!-- Data Flow Particles -->
  <circle cx="300" cy="150" r="3" fill="url(#autoGrad2)" filter="url(#glow)">
    <animate attributeName="cx" values="210;590;210" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;100;300;300;100" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="200" r="3" fill="url(#autoGrad3)" filter="url(#glow)">
    <animate attributeName="cx" values="590;210;590" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;300;300;100;100" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="250" r="3" fill="url(#autoGrad4)" filter="url(#glow)">
    <animate attributeName="cx" values="210;590;210" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;300;100;100;300" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Floating Elements -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="15" fill="url(#autoGrad1)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="15;25;15" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="20" fill="url(#autoGrad2)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="20;30;20" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#E2E8F0" font-size="24" font-weight="bold" opacity="0.8">Process Automation</text>
  <text x="400" y="375" text-anchor="middle" fill="#94A3B8" font-size="14" opacity="0.6">Intelligent Workflow Orchestration</text>
</svg>
