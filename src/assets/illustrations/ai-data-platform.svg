<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- AI Brain -->
  <g transform="translate(200, 80)">
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="url(#aiGrad)" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="40" ry="28" fill="#0B0E14"/>
    
    <!-- Neural Network Lines -->
    <path d="M -20 -10 L 0 0 L 20 -10" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
    <path d="M -20 0 L 0 0 L 20 0" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
    <path d="M -20 10 L 0 0 L 20 10" stroke="#06B6D4" stroke-width="2" opacity="0.8"/>
    <path d="M -15 -15 L 0 0 L 15 -15" stroke="#10B981" stroke-width="2" opacity="0.8"/>
    <path d="M -15 15 L 0 0 L 15 15" stroke="#10B981" stroke-width="2" opacity="0.8"/>
    
    <!-- Neural Nodes -->
    <circle cx="-20" cy="-10" r="3" fill="#10B981"/>
    <circle cx="-20" cy="0" r="3" fill="#06B6D4"/>
    <circle cx="-20" cy="10" r="3" fill="#06B6D4"/>
    <circle cx="20" cy="-10" r="3" fill="#10B981"/>
    <circle cx="20" cy="0" r="3" fill="#06B6D4"/>
    <circle cx="20" cy="10" r="3" fill="#06B6D4"/>
    <circle cx="-15" cy="-15" r="3" fill="#F59E0B"/>
    <circle cx="15" cy="-15" r="3" fill="#F59E0B"/>
    <circle cx="-15" cy="15" r="3" fill="#F59E0B"/>
    <circle cx="15" cy="15" r="3" fill="#F59E0B"/>
    
    <!-- Center Node -->
    <circle cx="0" cy="0" r="5" fill="#8B5CF6">
      <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Data Pipeline -->
  <g transform="translate(50, 180)">
    <!-- Data Sources -->
    <rect x="-30" y="-20" width="60" height="40" rx="6" fill="url(#dataGrad)" stroke="#8B5CF6" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Data Source</text>
    
    <!-- Processing -->
    <rect x="40" y="-20" width="60" height="40" rx="6" fill="url(#dataGrad)" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="70" cy="0" r="8" fill="#10B981" opacity="0.8"/>
    <circle cx="70" cy="0" r="5" fill="#0B0E14"/>
    <text x="70" y="25" text-anchor="middle" fill="#94A3B8" font-size="10">Process</text>
    
    <!-- Storage -->
    <rect x="110" y="-20" width="60" height="40" rx="6" fill="url(#dataGrad)" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="140" cy="-5" rx="20" ry="8" fill="#8B5CF6" opacity="0.8"/>
    <rect x="120" y="-5" width="40" height="20" fill="#8B5CF6" opacity="0.8"/>
    <ellipse cx="140" cy="15" rx="20" ry="8" fill="#6366F1" opacity="0.8"/>
    <text x="140" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Storage</text>
    
    <!-- Pipeline Connections -->
    <path d="M 30 0 L 40 0" stroke="#06B6D4" stroke-width="3"/>
    <path d="M 100 0 L 110 0" stroke="#06B6D4" stroke-width="3"/>
    
    <!-- Data Flow -->
    <circle cx="35" cy="0" r="2" fill="#10B981">
      <animate attributeName="cx" values="30;40;30" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="0" r="2" fill="#10B981">
      <animate attributeName="cx" values="100;110;100" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ML Models -->
  <g transform="translate(320, 180)">
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="url(#aiGrad)" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Model Layers -->
    <rect x="-25" y="-15" width="50" height="8" rx="2" fill="#8B5CF6" opacity="0.8"/>
    <rect x="-20" y="-5" width="40" height="6" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-15" y="5" width="30" height="6" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-10" y="15" width="20" height="6" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">ML Model</text>
  </g>
  
  <!-- Analytics Dashboard -->
  <g transform="translate(200, 250)">
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="url(#dataGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Charts -->
    <rect x="-30" y="-10" width="15" height="20" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-30" y="-10" width="15" height="15" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-30" y="-10" width="15" height="10" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <rect x="-10" y="-10" width="15" height="18" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-10" y="-10" width="15" height="12" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-10" y="-10" width="15" height="8" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <rect x="10" y="-10" width="15" height="22" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="10" y="-10" width="15" height="16" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="10" y="-10" width="15" height="12" rx="2" fill="#F59E0B" opacity="0.8"/>
    
    <text x="0" y="30" text-anchor="middle" fill="#94A3B8" font-size="10">Analytics</text>
  </g>
  
  <!-- AI Assistant -->
  <g transform="translate(200, 150)">
    <circle cx="0" cy="0" r="20" fill="url(#aiGrad)" opacity="0.8"/>
    <circle cx="0" cy="-8" r="6" fill="#8B5CF6" opacity="0.8"/>
    <rect x="-12" y="-2" width="24" height="12" rx="6" fill="#8B5CF6" opacity="0.8"/>
    <circle cx="-5" cy="2" r="2" fill="#06B6D4"/>
    <circle cx="5" cy="2" r="2" fill="#06B6D4"/>
    <path d="M -8 -8 Q 0 -12 8 -8" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    
    <!-- Speech Bubble -->
    <ellipse cx="25" cy="-15" rx="15" ry="8" fill="#06B6D4" opacity="0.6"/>
    <path d="M 15 -10 L 10 -5 L 20 -5 Z" fill="#06B6D4" opacity="0.6"/>
    <text x="25" y="-12" text-anchor="middle" fill="white" font-size="8">AI</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 150 200 L 180 150" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 220 150 L 280 180" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 200 170 L 200 230" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Data Particles -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="2" fill="#06B6D4" opacity="0.8">
      <animate attributeName="cx" values="0;50;100;50;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;-20;0;20;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="2" fill="#10B981" opacity="0.8">
      <animate attributeName="cx" values="0;-50;-100;-50;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;20;0;-20;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
