<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="premiumGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="premiumGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="premiumGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38F9D7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="premiumGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA709A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE140;stop-opacity:1" />
    </linearGradient>
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow Effects -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Premium Background -->
  <rect width="800" height="400" fill="url(#premiumGrad1)" opacity="0.1"/>
  <rect width="800" height="400" fill="#0F172A"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.3"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Main Cloud Infrastructure -->
  <g transform="translate(400, 200)">
    <!-- Central Cloud -->
    <ellipse cx="0" cy="0" rx="180" ry="80" fill="url(#premiumGrad2)" opacity="0.2" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="150" ry="60" fill="url(#premiumGrad2)" opacity="0.3"/>
    
    <!-- Cloud Layers -->
    <ellipse cx="-60" cy="-20" rx="80" ry="40" fill="url(#premiumGrad3)" opacity="0.4"/>
    <ellipse cx="60" cy="-20" rx="80" ry="40" fill="url(#premiumGrad3)" opacity="0.4"/>
    <ellipse cx="0" cy="-30" rx="100" ry="50" fill="url(#premiumGrad4)" opacity="0.3"/>
    
    <!-- Server Racks -->
    <g transform="translate(-100, 20)">
      <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#1E293B" filter="url(#shadow)"/>
      <rect x="-50" y="-30" width="100" height="8" rx="4" fill="url(#premiumGrad1)"/>
      <rect x="-50" y="-18" width="100" height="8" rx="4" fill="url(#premiumGrad2)"/>
      <rect x="-50" y="-6" width="100" height="8" rx="4" fill="url(#premiumGrad3)"/>
      <rect x="-50" y="6" width="100" height="8" rx="4" fill="url(#premiumGrad4)"/>
      <rect x="-50" y="18" width="100" height="8" rx="4" fill="url(#premiumGrad1)"/>
      
      <!-- Server Lights -->
      <circle cx="-40" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="-30" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="-20" cy="-26" r="3" fill="#F59E0B" filter="url(#glow)"/>
      <circle cx="-10" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="0" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="10" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="20" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="30" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="40" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
    </g>
    
    <g transform="translate(100, 20)">
      <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#1E293B" filter="url(#shadow)"/>
      <rect x="-50" y="-30" width="100" height="8" rx="4" fill="url(#premiumGrad1)"/>
      <rect x="-50" y="-18" width="100" height="8" rx="4" fill="url(#premiumGrad2)"/>
      <rect x="-50" y="-6" width="100" height="8" rx="4" fill="url(#premiumGrad3)"/>
      <rect x="-50" y="6" width="100" height="8" rx="4" fill="url(#premiumGrad4)"/>
      <rect x="-50" y="18" width="100" height="8" rx="4" fill="url(#premiumGrad1)"/>
      
      <!-- Server Lights -->
      <circle cx="-40" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="-30" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="-20" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="-10" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="0" cy="-26" r="3" fill="#F59E0B" filter="url(#glow)"/>
      <circle cx="10" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="20" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="30" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
      <circle cx="40" cy="-26" r="3" fill="#10B981" filter="url(#glow)"/>
    </g>
    
    <!-- Network Connections -->
    <path d="M -40 60 L 0 80 L 40 60" stroke="url(#premiumGrad2)" stroke-width="4" fill="none" opacity="0.8" filter="url(#glow)"/>
    <path d="M -100 20 L -50 0 L 0 20" stroke="url(#premiumGrad3)" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M 100 20 L 50 0 L 0 20" stroke="url(#premiumGrad3)" stroke-width="3" fill="none" opacity="0.6"/>
    
    <!-- Security Shield -->
    <g transform="translate(0, -80)">
      <path d="M 0 -30 L -25 -20 L -25 10 L 0 25 L 25 10 L 25 -20 Z" fill="url(#premiumGrad4)" opacity="0.8" filter="url(#shadow)"/>
      <path d="M 0 -25 L -20 -17 L -20 8 L 0 20 L 20 8 L 20 -17 Z" fill="#0F172A"/>
      <path d="M -10 -5 L -5 0 L 5 -10" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="0" cy="5" r="3" fill="#10B981" filter="url(#glow)"/>
    </g>
    
    <!-- Data Flow Particles -->
    <circle cx="-150" cy="0" r="4" fill="url(#premiumGrad2)" filter="url(#glow)">
      <animate attributeName="cx" values="-150;150;-150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;-20;0;20;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-100" cy="-30" r="3" fill="url(#premiumGrad3)" filter="url(#glow)">
      <animate attributeName="cx" values="-100;100;-100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="-30;-10;-30;-50;-30" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-50" cy="30" r="3" fill="url(#premiumGrad4)" filter="url(#glow)">
      <animate attributeName="cx" values="-50;50;-50" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;10;30;50;30" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Cloud Provider Logos -->
    <g transform="translate(-200, -100)">
      <rect x="-30" y="-15" width="60" height="30" rx="8" fill="#FF9900" opacity="0.8" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="14" font-weight="bold">AWS</text>
    </g>
    
    <g transform="translate(0, -120)">
      <rect x="-30" y="-15" width="60" height="30" rx="8" fill="#4285F4" opacity="0.8" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="14" font-weight="bold">GCP</text>
    </g>
    
    <g transform="translate(200, -100)">
      <rect x="-30" y="-15" width="60" height="30" rx="8" fill="#0078D4" opacity="0.8" filter="url(#shadow)"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Azure</text>
    </g>
  </g>
  
  <!-- Floating Elements -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="20" fill="url(#premiumGrad1)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(700, 300)">
    <circle cx="0" cy="0" r="15" fill="url(#premiumGrad2)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="15;25;15" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#E2E8F0" font-size="24" font-weight="bold" opacity="0.8">Cloud Infrastructure</text>
  <text x="400" y="375" text-anchor="middle" fill="#94A3B8" font-size="14" opacity="0.6">Enterprise-Grade Multi-Cloud Solutions</text>
</svg>
