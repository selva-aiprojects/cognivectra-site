<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leadershipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="strategyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Executive Figure -->
  <g transform="translate(200, 100)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="25" ry="30" fill="url(#leadershipGrad)" opacity="0.8"/>
    
    <!-- Head -->
    <circle cx="0" cy="-10" r="20" fill="url(#leadershipGrad)" opacity="0.8"/>
    
    <!-- Tie -->
    <path d="M 0 0 L 0 30 L 8 35 L 0 40 L -8 35 Z" fill="#06B6D4" opacity="0.8"/>
    
    <!-- Face -->
    <circle cx="-5" cy="-10" r="2" fill="#0B0E14"/>
    <circle cx="5" cy="-10" r="2" fill="#0B0E14"/>
    <path d="M -8 -2 Q 0 0 8 -2" stroke="#0B0E14" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Briefcase -->
    <rect x="20" y="10" width="30" height="20" rx="4" fill="#8B5CF6" opacity="0.8" stroke="#6366F1" stroke-width="2"/>
    <rect x="25" y="15" width="20" height="10" rx="2" fill="#0B0E14"/>
    <circle cx="30" cy="20" r="2" fill="#06B6D4"/>
    <circle cx="40" cy="20" r="2" fill="#06B6D4"/>
  </g>
  
  <!-- Strategy Board -->
  <g transform="translate(50, 50)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="url(#strategyGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Board Content -->
    <rect x="-30" y="-20" width="60" height="4" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="-30" y="-12" width="40" height="4" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="-30" y="-4" width="50" height="4" rx="2" fill="#F59E0B" opacity="0.8"/>
    <rect x="-30" y="4" width="35" height="4" rx="2" fill="#EF4444" opacity="0.8"/>
    <rect x="-30" y="12" width="45" height="4" rx="2" fill="#10B981" opacity="0.8"/>
    
    <!-- Chart -->
    <g transform="translate(0, -5)">
      <rect x="15" y="-15" width="8" height="30" fill="#10B981" opacity="0.8"/>
      <rect x="25" y="-10" width="8" height="25" fill="#06B6D4" opacity="0.8"/>
      <rect x="35" y="-20" width="8" height="35" fill="#F59E0B" opacity="0.8"/>
    </g>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Strategy</text>
  </g>
  
  <!-- Roadmap -->
  <g transform="translate(350, 50)">
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="url(#strategyGrad)" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- Timeline -->
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="#06B6D4" stroke-width="2"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#06B6D4" stroke-width="2"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#06B6D4" stroke-width="2"/>
    
    <!-- Milestones -->
    <circle cx="-20" cy="-20" r="4" fill="#10B981"/>
    <circle cx="0" cy="-20" r="4" fill="#F59E0B"/>
    <circle cx="20" cy="-20" r="4" fill="#EF4444"/>
    
    <circle cx="-20" cy="0" r="4" fill="#10B981"/>
    <circle cx="0" cy="0" r="4" fill="#10B981"/>
    <circle cx="20" cy="0" r="4" fill="#F59E0B"/>
    
    <circle cx="-20" cy="20" r="4" fill="#EF4444"/>
    <circle cx="0" cy="20" r="4" fill="#10B981"/>
    <circle cx="20" cy="20" r="4" fill="#10B981"/>
    
    <text x="0" y="40" text-anchor="middle" fill="#94A3B8" font-size="10">Roadmap</text>
  </g>
  
  <!-- Team Meeting -->
  <g transform="translate(100, 220)">
    <rect x="-40" y="-25" width="80" height="50" rx="8" fill="url(#leadershipGrad)" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Team Members -->
    <circle cx="-15" cy="-5" r="8" fill="#06B6D4" opacity="0.8"/>
    <circle cx="-15" cy="-5" r="5" fill="#0B0E14"/>
    <circle cx="0" cy="-5" r="8" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="-5" r="5" fill="#0B0E14"/>
    <circle cx="15" cy="-5" r="8" fill="#06B6D4" opacity="0.8"/>
    <circle cx="15" cy="-5" r="5" fill="#0B0E14"/>
    
    <!-- Discussion Lines -->
    <path d="M -10 -5 L 10 -5" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <path d="M -15 5 L 15 5" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
    <path d="M -10 15 L 10 15" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Team</text>
  </g>
  
  <!-- Advisory Board -->
  <g transform="translate(300, 220)">
    <rect x="-35" y="-25" width="70" height="50" rx="8" fill="url(#leadershipGrad)" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Board Table -->
    <rect x="-25" y="-10" width="50" height="20" rx="4" fill="#8B5CF6" opacity="0.8"/>
    
    <!-- Board Members -->
    <circle cx="-15" cy="0" r="4" fill="#10B981"/>
    <circle cx="-5" cy="0" r="4" fill="#06B6D4"/>
    <circle cx="5" cy="0" r="4" fill="#F59E0B"/>
    <circle cx="15" cy="0" r="4" fill="#EF4444"/>
    
    <!-- Documents -->
    <rect x="-20" y="-15" width="8" height="10" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="-8" y="-15" width="8" height="10" rx="1" fill="#10B981" opacity="0.8"/>
    <rect x="4" y="-15" width="8" height="10" rx="1" fill="#F59E0B" opacity="0.8"/>
    
    <text x="0" y="35" text-anchor="middle" fill="#94A3B8" font-size="10">Advisory</text>
  </g>
  
  <!-- Growth Arrow -->
  <g transform="translate(200, 200)">
    <path d="M 0 -20 L 0 20" stroke="#10B981" stroke-width="4" opacity="0.8"/>
    <path d="M -5 15 L 0 20 L 5 15" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M -5 -15 L 0 -20 L 5 -15" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <circle cx="0" cy="0" r="8" fill="#10B981" opacity="0.8">
      <animate attributeName="cy" values="-20;20;-20" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Connection Lines -->
  <path d="M 90 75 L 180 100" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 220 100 L 310 75" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 140 220 L 180 200" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 220 200 L 260 220" stroke="#06B6D4" stroke-width="2" opacity="0.4" stroke-dasharray="5,5"/>
  
  <!-- Success Indicators -->
  <g transform="translate(50, 150)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(350, 150)">
    <circle cx="0" cy="0" r="12" fill="#10B981" opacity="0.8"/>
    <path d="M -5 0 L -2 3 L 5 -4" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
