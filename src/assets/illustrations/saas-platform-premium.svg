<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="saasGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764BA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F093FB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="saasGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F2FE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="saasGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43E97B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38F9D7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="saasGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA709A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FEE140;stop-opacity:1" />
    </linearGradient>
    <!-- Glow Effects -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow Effects -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Premium Background -->
  <rect width="800" height="400" fill="url(#saasGrad1)" opacity="0.1"/>
  <rect width="800" height="400" fill="#0F172A"/>
  
  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.3"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Central SaaS Platform -->
  <g transform="translate(400, 200)">
    <!-- Platform Base -->
    <rect x="-120" y="-60" width="240" height="120" rx="16" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-110" y="-50" width="220" height="100" rx="12" fill="url(#saasGrad2)" opacity="0.3"/>
    
    <!-- Multi-Tenant Layers -->
    <rect x="-100" y="-40" width="200" height="15" rx="4" fill="url(#saasGrad1)" opacity="0.8"/>
    <rect x="-95" y="-20" width="190" height="15" rx="4" fill="url(#saasGrad2)" opacity="0.8"/>
    <rect x="-90" y="0" width="180" height="15" rx="4" fill="url(#saasGrad3)" opacity="0.8"/>
    <rect x="-85" y="20" width="170" height="15" rx="4" fill="url(#saasGrad4)" opacity="0.8"/>
    
    <!-- User Icons in Layers -->
    <circle cx="-80" cy="-32" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-60" cy="-32" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-40" cy="-32" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="-20" cy="-32" r="4" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="0" cy="-32" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="20" cy="-32" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="40" cy="-32" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="60" cy="-32" r="4" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="80" cy="-32" r="4" fill="#10B981" filter="url(#glow)"/>
    
    <circle cx="-70" cy="-12" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-50" cy="-12" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-30" cy="-12" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="-10" cy="-12" r="4" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="10" cy="-12" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="30" cy="-12" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="50" cy="-12" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="70" cy="-12" r="4" fill="#EF4444" filter="url(#glow)"/>
    
    <circle cx="-60" cy="8" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-40" cy="8" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-20" cy="8" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="0" cy="8" r="4" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="20" cy="8" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="40" cy="8" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="60" cy="8" r="4" fill="#F59E0B" filter="url(#glow)"/>
    
    <circle cx="-50" cy="28" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="-30" cy="28" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-10" cy="28" r="4" fill="#F59E0B" filter="url(#glow)"/>
    <circle cx="10" cy="28" r="4" fill="#EF4444" filter="url(#glow)"/>
    <circle cx="30" cy="28" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="50" cy="28" r="4" fill="#06B6D4" filter="url(#glow)"/>
    
    <!-- Central Hub -->
    <circle cx="0" cy="0" r="8" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- SaaS Components -->
  <g transform="translate(150, 100)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="url(#saasGrad1)" opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#E2E8F0" font-size="10" font-weight="bold">AUTH</text>
    <circle cx="-15" cy="5" r="3" fill="#10B981"/>
    <circle cx="0" cy="5" r="3" fill="#06B6D4"/>
    <circle cx="15" cy="5" r="3" fill="#F59E0B"/>
    <circle cx="0" cy="-15" r="3" fill="#10B981" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(650, 100)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="url(#saasGrad2)" opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#E2E8F0" font-size="10" font-weight="bold">BILLING</text>
    <rect x="-20" y="5" width="40" height="15" rx="3" fill="#10B981" opacity="0.8"/>
    <text x="0" y="15" text-anchor="middle" fill="#0F172A" font-size="8" font-weight="bold">$</text>
    <circle cx="0" cy="-15" r="3" fill="#06B6D4" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(150, 300)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="url(#saasGrad3)" opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#E2E8F0" font-size="10" font-weight="bold">NOTIFY</text>
    <path d="M -15 5 L 15 5" stroke="#10B981" stroke-width="2"/>
    <path d="M -15 10 L 15 10" stroke="#06B6D4" stroke-width="2"/>
    <path d="M -15 15 L 15 15" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="-15" r="3" fill="#10B981" filter="url(#glow)"/>
  </g>
  
  <g transform="translate(650, 300)">
    <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-40" y="-20" width="80" height="40" rx="6" fill="url(#saasGrad4)" opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" fill="#E2E8F0" font-size="10" font-weight="bold">ANALYTICS</text>
    <rect x="-20" y="5" width="8" height="15" rx="1" fill="#10B981" opacity="0.8"/>
    <rect x="-8" y="0" width="8" height="20" rx="1" fill="#06B6D4" opacity="0.8"/>
    <rect x="4" y="-5" width="8" height="25" rx="1" fill="#F59E0B" opacity="0.8"/>
    <rect x="16" y="-10" width="8" height="30" rx="1" fill="#EF4444" opacity="0.8"/>
    <circle cx="0" cy="-15" r="3" fill="#F59E0B" filter="url(#glow)"/>
  </g>
  
  <!-- API Connections -->
  <g transform="translate(400, 200)">
    <circle cx="-120" cy="-60" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="120" cy="-60" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="-120" cy="60" r="4" fill="#10B981" filter="url(#glow)"/>
    <circle cx="120" cy="60" r="4" fill="#F59E0B" filter="url(#glow)"/>
    
    <!-- Connection Lines -->
    <path d="M -120 -60 L -100 -40" stroke="url(#saasGrad1)" stroke-width="2" opacity="0.6"/>
    <path d="M 120 -60 L 100 -40" stroke="url(#saasGrad2)" stroke-width="2" opacity="0.6"/>
    <path d="M -120 60 L -100 40" stroke="url(#saasGrad3)" stroke-width="2" opacity="0.6"/>
    <path d="M 120 60 L 100 40" stroke="url(#saasGrad4)" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Data Flow -->
  <path d="M 200 100 Q 400 150 600 100" stroke="url(#saasGrad1)" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8,4" filter="url(#glow)"/>
  <path d="M 200 300 Q 400 250 600 300" stroke="url(#saasGrad2)" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8,4" filter="url(#glow)"/>
  
  <!-- Data Particles -->
  <circle cx="300" cy="150" r="2" fill="url(#saasGrad1)" filter="url(#glow)">
    <animate attributeName="cx" values="200;600;200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="100;100;300;300;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="250" r="2" fill="url(#saasGrad2)" filter="url(#glow)">
    <animate attributeName="cx" values="600;200;600" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;300;100;100;300" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Growth Metrics -->
  <g transform="translate(400, 80)">
    <rect x="-40" y="-15" width="80" height="30" rx="6" fill="#1E293B" filter="url(#shadow)"/>
    <rect x="-35" y="-10" width="70" height="20" rx="4" fill="url(#saasGrad3)" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" fill="#10B981" font-size="12" font-weight="bold">+127% Growth</text>
  </g>
  
  <!-- Floating Elements -->
  <g transform="translate(100, 50)">
    <circle cx="0" cy="0" r="12" fill="url(#saasGrad1)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="12;20;12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="15" fill="url(#saasGrad2)" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="15;25;15" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="400" y="350" text-anchor="middle" fill="#E2E8F0" font-size="24" font-weight="bold" opacity="0.8">SaaS Platform</text>
  <text x="400" y="375" text-anchor="middle" fill="#94A3B8" font-size="14" opacity="0.6">Multi-Tenant Architecture & Components</text>
</svg>
