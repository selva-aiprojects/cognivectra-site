<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Cloud Infrastructure Background -->
  <rect width="400" height="300" fill="#0B0E14"/>
  
  <!-- Cloud Shape -->
  <ellipse cx="200" cy="80" rx="120" ry="40" fill="url(#cloudGrad)" opacity="0.3"/>
  <ellipse cx="150" cy="90" rx="80" ry="35" fill="url(#cloudGrad)" opacity="0.3"/>
  <ellipse cx="250" cy="90" rx="80" ry="35" fill="url(#cloudGrad)" opacity="0.3"/>
  
  <!-- Server Racks -->
  <g transform="translate(80, 120)">
    <!-- Server 1 -->
    <rect x="0" y="0" width="60" height="80" rx="4" fill="url(#serverGrad)" stroke="#6366F1" stroke-width="2"/>
    <rect x="5" y="5" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="18" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="5" y="31" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <circle cx="10" cy="50" r="3" fill="#10B981"/>
    <circle cx="20" cy="50" r="3" fill="#10B981"/>
    <circle cx="30" cy="50" r="3" fill="#F59E0B"/>
    
    <!-- Server 2 -->
    <rect x="70" y="0" width="60" height="80" rx="4" fill="url(#serverGrad)" stroke="#6366F1" stroke-width="2"/>
    <rect x="75" y="5" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="75" y="18" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="75" y="31" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <circle cx="80" cy="50" r="3" fill="#10B981"/>
    <circle cx="90" cy="50" r="3" fill="#10B981"/>
    <circle cx="100" cy="50" r="3" fill="#10B981"/>
    
    <!-- Server 3 -->
    <rect x="140" y="0" width="60" height="80" rx="4" fill="url(#serverGrad)" stroke="#6366F1" stroke-width="2"/>
    <rect x="145" y="5" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="145" y="18" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="145" y="31" width="50" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <circle cx="150" cy="50" r="3" fill="#10B981"/>
    <circle cx="160" cy="50" r="3" fill="#F59E0B"/>
    <circle cx="170" cy="50" r="3" fill="#10B981"/>
  </g>
  
  <!-- Network Lines -->
  <path d="M 140 160 L 260 160" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
  <path d="M 200 160 L 200 220" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="160" r="4" fill="#06B6D4"/>
  
  <!-- Database -->
  <g transform="translate(170, 220)">
    <ellipse cx="30" cy="10" rx="25" ry="8" fill="#8B5CF6" opacity="0.8"/>
    <rect x="5" y="10" width="50" height="30" fill="#8B5CF6" opacity="0.8"/>
    <ellipse cx="30" cy="40" rx="25" ry="8" fill="#6366F1" opacity="0.8"/>
    <ellipse cx="30" cy="10" rx="25" ry="8" fill="#8B5CF6" opacity="0.8"/>
  </g>
  
  <!-- Security Shield -->
  <g transform="translate(280, 140)">
    <path d="M 20 5 L 35 10 L 35 25 Q 35 35 20 40 Q 5 35 5 25 L 5 10 Z" fill="#10B981" opacity="0.8"/>
    <path d="M 15 18 L 18 21 L 25 14" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- AWS/GCP/Azure Logos -->
  <text x="50" y="270" fill="#FF9900" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AWS</text>
  <text x="170" y="270" fill="#4285F4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">GCP</text>
  <text x="290" y="270" fill="#0078D4" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Azure</text>
</svg>
