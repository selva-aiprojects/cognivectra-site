<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0f172a"/>
  <defs>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="60" result="effect1_foregroundBlur"/>
    </filter>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="grad2" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background Shapes -->
  <circle cx="200" cy="200" r="300" fill="url(#grad1)" filter="url(#f1)" opacity="0.4"/>
  <circle cx="600" cy="400" r="250" fill="url(#grad2)" filter="url(#f1)" opacity="0.5"/>
  
  <!-- Communication Nodes -->
  <g stroke="url(#grad1)" stroke-width="2" opacity="0.3">
    <line x1="200" y1="300" x2="600" y2="300" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="200" cy="300" r="10" fill="#3b82f6"/>
    <circle cx="600" cy="300" r="10" fill="#8b5cf6"/>
    
    <!-- Pulse Effect -->
    <circle cx="200" cy="300" r="20" stroke="#3b82f6" stroke-width="1" fill="none">
      <animate attributeName="r" from="10" to="40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="20" stroke="#8b5cf6" stroke-width="1" fill="none">
      <animate attributeName="r" from="10" to="40" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" from="1" to="0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Chat Bubble Abstract -->
  <path d="M350 200 H450 A20 20 0 0 1 470 220 V280 A20 20 0 0 1 450 300 H420 L400 320 L380 300 H350 A20 20 0 0 1 330 280 V220 A20 20 0 0 1 350 200 Z" 
        fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
        
  <rect x="0" y="0" width="800" height="600" fill="url(#grad2)" style="mix-blend-mode: overlay;"/>
</svg>