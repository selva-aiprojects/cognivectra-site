<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#1e293b"/>
  
  <!-- Central Hub -->
  <circle cx="400" cy="300" r="60" stroke="#6366f1" stroke-width="4"/>
  <circle cx="400" cy="300" r="30" fill="#6366f1" fill-opacity="0.4"/>
  
  <!-- Connections -->
  <line x1="400" y1="300" x2="200" y2="150" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="300" x2="600" y2="150" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="300" x2="200" y2="450" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="300" x2="600" y2="450" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="300" x2="150" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="400" y1="300" x2="650" y2="300" stroke="#475569" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="200" cy="150" r="20" fill="#818cf8"/>
  <circle cx="600" cy="150" r="20" fill="#818cf8"/>
  <circle cx="200" cy="450" r="20" fill="#818cf8"/>
  <circle cx="600" cy="450" r="20" fill="#818cf8"/>
  <circle cx="150" cy="300" r="20" fill="#818cf8"/>
  <circle cx="650" cy="300" r="20" fill="#818cf8"/>

  <!-- Avatars/Details -->
  <circle cx="200" cy="150" r="10" fill="#1e293b" fill-opacity="0.5"/>
  <circle cx="600" cy="150" r="10" fill="#1e293b" fill-opacity="0.5"/>
  <circle cx="200" cy="450" r="10" fill="#1e293b" fill-opacity="0.5"/>
  <circle cx="600" cy="450" r="10" fill="#1e293b" fill-opacity="0.5"/>

  <!-- Pulse Effect (Simulated) -->
  <circle cx="400" cy="300" r="100" stroke="#6366f1" stroke-width="1" stroke-dasharray="5 5" opacity="0.5"/>
</svg>