  <circle cx="600" cy="300" r="30" fill="#818cf8"/>
  <line x1="570" y1="300" x2="480" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  
  <circle cx="400" cy="450" r="30" fill="#818cf8"/>
  <line x1="400" y1="420" x2="400" y2="380" stroke="#cbd5e1" stroke-width="2"/>
  
  <circle cx="200" cy="300" r="30" fill="#818cf8"/>
